# Interactive labelling at https://<server>/iseg/, on the server's existing
# HTTPS site. Not a site of its own: paste these lines into the
# <VirtualHost 192.168.25.110:443> block of
# /etc/apache2/sites-available/ailab-ssl.conf, next to the /mas/ lines.
# Walkthrough: deploy/ailab26.md (step 7).

    # /iseg without the slash would miss the proxy below.
    RedirectMatch ^/iseg$ /iseg/
    # Apache strips /iseg/; the app serves its page and /api/... at its root
    # and finds its own base path in the browser. Long timeout: the first
    # click on an image waits for the model to load.
    ProxyPass        /iseg/ http://127.0.0.1:8020/ timeout=600
    ProxyPassReverse /iseg/ http://127.0.0.1:8020/
    <Location /iseg/>
        # So the app knows the browser used HTTPS (it adds HSTS then).
        # Apache adds X-Forwarded-For itself; uvicorn trusts both from 127.0.0.1,
        # so the audit log and the sign-in lockout see the real client address.
        RequestHeader set X-Forwarded-Proto "https"
        # Image uploads are up to 200 MB per request (the app enforces that).
        LimitRequestBody 220200960
    </Location>
